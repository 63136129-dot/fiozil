<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrador - FiOzil</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f4f6f8; margin: 0; }
    .login-card { background: white; padding: 2.5rem; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; }
    .login-card h2 { color: #0f769e; margin-bottom: 0.5rem; }
    .subtitle { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.2rem; text-align: left; }
    .form-group label { display: block; margin-bottom: .4rem; font-size: 0.85rem; font-weight: 600; color: #444; }
    .form-group input { width: 100%; padding: .75rem; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; }
    
    .btn-submit { width: 100%; padding: .8rem; background: #0f769e; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.2s; margin-top: 0.5rem; }
    .btn-submit:hover { background: #0b5977; }
    
    .btn-back { display: inline-block; width: 100%; padding: .75rem; background: #e2e8f0; color: #334155; border: none; border-radius: 6px; font-weight: 600; font-size: 0.9rem; cursor: pointer; text-decoration: none; margin-top: 0.8rem; box-sizing: border-box; transition: background 0.2s; }
    .btn-back:hover { background: #cbd5e1; }
    
    #error-msg { font-size: 0.9rem; margin-top: 1rem; font-weight: bold; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Panel Administrativo</h2>
    <p class="subtitle">Ingresa tus credenciales para gestionar mensajes</p>

    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" required placeholder="tu-correo@ejemplo.com" />
    </div>
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" required placeholder="******" />
    </div>

    <button type="button" id="btnLogin" class="btn-submit">Iniciar Sesión</button>
    <a href="index.html" class="btn-back">← Regresar al Inicio</a>

    <p id="error-msg"></p>
  </div>

  <script>
    const SUPABASE_URL = 'https://qalinzpceicvetzhpwqw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_dT1CXqwj59kK7ydy1f7zjg_TJiOZhgx'; // <-- Pega tu Anon Key aquí

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('btnLogin').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('error-msg');

      if (!email || !password) {
        errorMsg.style.color = '#dc2626';
        errorMsg.textContent = 'Por favor ingresa tu correo y contraseña.';
        return;
      }

      errorMsg.style.color = '#0f769e';
      errorMsg.textContent = 'Verificando credenciales...';

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          errorMsg.style.color = '#dc2626';
          errorMsg.textContent = 'Credenciales incorrectas: ' + error.message;
        } else if (data.user) {
          errorMsg.style.color = '#16a34a';
          errorMsg.textContent = '¡Acceso correcto! Redirigiendo...';
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 500);
        }
      } catch (err) {
        errorMsg.style.color = '#dc2626';
        errorMsg.textContent = 'Error de conexión con la base de datos.';
        console.error(err);
      }
    });
  </script>
</body>
</html>
