<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrador</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f4f6f8; margin: 0; }
    .login-card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 380px; }
    .login-card h2 { color: #0f769e; margin-bottom: 1.5rem; text-align: center; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: .5rem; font-size: 0.9rem; }
    .form-group input { width: 100%; padding: .75rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: .75rem; background: #0f769e; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:hover { background: #0b5977; }
    #error-msg { color: red; font-size: 0.85rem; margin-top: 1rem; text-align: center; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Panel Administrativo</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" required />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required />
      </div>
      <button type="submit">Iniciar Sesión</button>
    </form>
    <p id="error-msg"></p>
  </div>

  <script>
    // 1. Asegúrate de colocar tu API Key (Anon / Public) de Supabase aquí:
    const SUPABASE_URL = 'https://qalinzpceicvetzhpwqw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_dT1CXqwj59kK7ydy1f7zjg_TJiOZhgx'; // <-- REEMPLAZA ESTO CON TU CLAVE REAL
  
    // Inicializar cliente
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  
    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('error-msg');
  
    loginForm.addEventListener('submit', async function (e) {
      // Evitar que la página se recargue y limpie los datos
      e.preventDefault();
      e.stopPropagation();
  
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
  
      errorMsg.style.color = '#0f769e';
      errorMsg.textContent = 'Verificando credenciales...';
  
      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });
  
        if (error) {
          errorMsg.style.color = 'red';
          errorMsg.textContent = 'Error: ' + error.message;
          console.error('Error de Supabase:', error);
        } else if (data.user) {
          errorMsg.style.color = 'green';
          errorMsg.textContent = '¡Acceso correcto! Redirigiendo...';
          
          // Redirigir al dashboard
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 800);
        }
      } catch (err) {
        errorMsg.style.color = 'red';
        errorMsg.textContent = 'Ocurrió un error al conectar.';
        console.error('Error del sistema:', err);
      }
  
      return false;
    });
  </script>
</body>
</html>
